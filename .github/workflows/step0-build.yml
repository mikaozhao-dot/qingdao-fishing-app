name: Step 0 dual-platform builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/step0-build.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - name: Run Flutter regression tests
        run: flutter test --no-pub
      - name: Analyze Flutter app
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
      - name: Upload full analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-${{ github.run_id }}
          path: ${{ runner.temp }}/flutter-analyze.log
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Install Android SDK target
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  ios:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign --no-pub
