<h2>V04 选位图设计改稿示意（Muse，2026-10-24）</h2>
<p>状态：设计改稿示意，供 Codex（Luna）实现参照与 dot 评审比对，不是定版、不是 App 截图。
布局依据创始人草图原图（尖头船首、驾驶舱居中、双过道、后甲板、船尾发动机）；
左舷船头起 1→6、右舷船头起 12→7；船尾四位 5/6/7/8 为加价位（★，演示价 ¥600，其余 ¥500，均为演示数据）。
如与草图原图或返工令冲突，以草图原图与返工令为准。</p>
